server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    location = /remoteEntry.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    location ~ "^/[0-9a-z_-]+\.[0-9a-f]{16}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    location = /config/runtime.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/document-headers.conf;
    }

    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    location ~ "/\." {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    location ~ "^/(api|otel|csp-report|config|remotes)(/|$)" {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* "\.(js|mjs|css|map|json|png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf|txt|xml|webmanifest|html|htm)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/document-headers.conf;
        try_files $uri /index.html;
    }
}
