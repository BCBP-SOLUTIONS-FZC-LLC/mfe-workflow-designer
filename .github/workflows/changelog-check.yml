# Fails when a pull request changes the studio, its dependencies, or the image
# without also updating CHANGELOG.md.
name: Changelog check

"on":
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx/**'
      - 'rsbuild.config.ts'
      - 'config/**'
      - 'public/config/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: CHANGELOG updated in this pull request
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this pull request."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This pull request changes the studio, its dependencies, or the image but does not update CHANGELOG.md. Add an entry under Unreleased."
            exit 1
          fi
