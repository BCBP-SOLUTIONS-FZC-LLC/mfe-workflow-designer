version: 2

# GitHub Packages (@bcbp-solutions-fzc-llc/*): Dependabot needs PACKAGES_READ_TOKEN,
# a Dependabot secret with read:packages. Without it, npm updates fail with 401.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_READ_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    ignore:
      # The platform packages move together, and the shell moves first.
      - dependency-name: "@bcbp-solutions-fzc-llc/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
